[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.18.0",
    "fastapi>=0.110.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
